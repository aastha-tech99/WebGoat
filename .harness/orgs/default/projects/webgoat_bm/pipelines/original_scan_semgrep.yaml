pipeline:
  name: original scan semgrep
  identifier: original_scan_semgrep
  tags: {}
  projectIdentifier: webgoat_bm
  orgIdentifier: default
  stages:
    - stage:
        name: init
        identifier: init
        description: ""
        type: SecurityTests
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: account.remediationagentdelegate
              namespace: harness-qa-delegate
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Semgrep
                  name: Semgrep_1
                  identifier: Semgrep_1
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      detection: auto
                    advanced:
                      log:
                        level: info
  properties:
    ci:
      codebase:
        connectorRef: webgoat_bm
        repoName: https://github.com/aastha-tech99/WebGoat
        build: <+input>
