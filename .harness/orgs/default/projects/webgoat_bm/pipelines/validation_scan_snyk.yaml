pipeline:
  name: validation scan snyk
  identifier: validation_scan_snyk
  tags: {}
  projectIdentifier: webgoat_bm
  orgIdentifier: default
  properties:
    ci:
      codebase:
        connectorRef: webgoat_bm
        build: <+input>
  stages:
    - stage:
        name: init
        identifier: init
        description: ""
        type: SecurityTests
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: account.remediationagentdelegate
              namespace: harness-qa-delegate
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Snyk
                  name: Snyk_1
                  identifier: Snyk_1
                  spec:
                    mode: orchestration
                    config: oss
                    target:
                      type: repository
                      detection: auto
                    advanced:
                      log:
                        level: info
                    privileged: true
                    auth:
                      # ROTATE: the previous hardcoded token must be revoked -- it was exposed in version control history
                      access_token: <+secrets.getValue("snyk_access_token")>
                    sbom:
                      format: spdx-json
